name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check stockmind/

      - name: ruff format --check
        run: ruff format --check stockmind/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # requirements-test.txt enthält nur die für Tests nötigen Pakete –
        # kein Streamlit/Plotly/yfinance. Dadurch entfallen schwere Binary-Builds
        # und python-dotenv ist garantiert installiert bevor config importiert wird.
        run: pip install -r stockmind/requirements-test.txt

      - name: Run tests
        run: pytest tests/ --timeout=60 -v
